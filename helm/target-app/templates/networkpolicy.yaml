# Network Policy for MySQL Database
# Restricts access to MySQL pod to only web application pods

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "target-app.fullname" . }}-mysql-netpol
  labels:
    {{- include "target-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  podSelector:
    matchLabels:
      {{- include "target-app.mysql.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic only from web pods
    - from:
      - podSelector:
          matchLabels:
            {{- include "target-app.web.selectorLabels" . | nindent 12 }}
      ports:
        - protocol: TCP
          port: 3306
  egress:
    # Allow DNS resolution
    - to:
      - namespaceSelector:
          matchLabels:
            name: kube-system
      ports:
        - protocol: UDP
          port: 53
    # Allow outbound connections (for updates, etc.)
    - to:
      - podSelector: {}
      ports:
        - protocol: TCP
          port: 443
---
# Network Policy for Web Application
# Restricts ingress to only from Ingress controller and egress to MySQL

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "target-app.fullname" . }}-web-netpol
  labels:
    {{- include "target-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  podSelector:
    matchLabels:
      {{- include "target-app.web.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from Ingress controller
    - from:
      - namespaceSelector:
          matchLabels:
            name: ingress-nginx
      ports:
        - protocol: TCP
          port: 80
    # Allow traffic from within namespace (for monitoring, etc.)
    - from:
      - podSelector: {}
      ports:
        - protocol: TCP
          port: 80
  egress:
    # Allow DNS resolution
    - to:
      - namespaceSelector:
          matchLabels:
            name: kube-system
      ports:
        - protocol: UDP
          port: 53
    # Allow connection to MySQL
    - to:
      - podSelector:
          matchLabels:
            {{- include "target-app.mysql.selectorLabels" . | nindent 12 }}
      ports:
        - protocol: TCP
          port: 3306
    # Allow HTTPS egress (for external APIs if needed)
    - to:
      - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 443
